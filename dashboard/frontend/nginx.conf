server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router / client-side routing fallback -- not currently used
    # (this is a single-page dashboard with no routes), but harmless to
    # have in place if you add pages later.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies /api/* to the backend container. The frontend was built
    # with VITE_API_BASE_URL="" (see Dockerfile), so all its fetch()
    # calls are same-origin relative paths like "/api/health" -- nginx
    # forwards those here. This means the browser only ever talks to
    # ONE origin (this nginx container), avoiding CORS entirely in
    # production.
    location /api/ {
        # proxy_pass http://backend:8000/api/;
        proxy_pass http://$docker_host:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reasonable caching for hashed static assets; index.html itself is
    # NOT cached so a redeploy is picked up immediately.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
